<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b3036" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zoom Garage" />
    <meta name="description" content="Build a race car, race it, and give it a pit stop. A Pocket Giggles game." />
    <title>Zoom Garage</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Title -->
      <section class="screen screen--title" id="scr-title">
        <button class="gear" type="button" data-gear aria-label="Grown-ups: hold for settings"><i></i></button>
        <div class="sun" aria-hidden="true"></div>
        <h1 class="logo"><span class="logo__a">ZOOM</span><span class="logo__b">GARAGE</span></h1>
        <div class="title-road">
          <canvas id="titleCar" class="title-car" aria-hidden="true"></canvas>
        </div>
        <div class="title-bottom">
          <div class="shelf" id="shelf" aria-label="Trophies"></div>
          <button class="big-btn" id="btnStart" type="button">LET'S GO!</button>
          <div class="flags" id="flagsTitle"></div>
        </div>
      </section>

      <!-- Garage: build your car -->
      <section class="screen screen--garage" id="scr-garage" hidden>
        <header class="garage-top">
          <h2 class="garage-name" id="garageName">ANDY'S CAR</h2>
          <div class="flags" id="flagsGarage"></div>
        </header>
        <div class="preview"><canvas id="previewCar" aria-hidden="true"></canvas></div>
        <nav class="tabs" role="tablist" aria-label="Build your car">
          <button class="tab is-on" type="button" role="tab" data-tab="body"><b>🏎️</b>CAR</button>
          <button class="tab" type="button" role="tab" data-tab="color"><b>🎨</b>PAINT</button>
          <button class="tab" type="button" role="tab" data-tab="number"><b>#</b>NUMBER</button>
          <button class="tab" type="button" role="tab" data-tab="sticker"><b>⭐</b>STICKER</button>
        </nav>
        <div class="options" id="options"></div>
        <button class="big-btn big-btn--go" id="btnRace" type="button">RACE!</button>
      </section>

      <!-- Track picker -->
      <section class="screen screen--tracks" id="scr-tracks" hidden>
        <h2 class="screen-head">PICK A TRACK</h2>
        <div class="track-list" id="trackList"></div>
        <button class="back-btn" id="btnTracksBack" type="button">◀ GARAGE</button>
      </section>

      <!-- Race -->
      <section class="screen screen--race" id="scr-race" hidden>
        <canvas id="raceCanvas" aria-label="Race track"></canvas>
        <div class="hud">
          <button class="pause-btn" id="btnPause" type="button" aria-label="Pause"><i></i><i></i></button>
          <div class="pill" id="hudLap">LAP 1/3</div>
          <div class="pill pill--pos" id="hudPos">3rd</div>
        </div>
        <div class="lights" id="lights" hidden aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="banner" id="raceBanner" hidden></div>
        <div class="curve-chip" id="curveChip" hidden>CURVE! LET GO</div>
        <button class="turbo-btn" id="btnTurbo" type="button" hidden aria-label="Turbo">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-bg" cx="50" cy="50" r="44" />
            <circle class="ring" id="turboRing" cx="50" cy="50" r="44" />
            <path class="bolt" d="M56 14 30 56h18l-6 30 28-44H52z" />
          </svg>
        </button>
        <div class="controls">
          <button class="ctl ctl--steer" id="btnLeft" type="button" hidden aria-label="Move left">
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M26 6 10 20l16 14z" /></svg>
          </button>
          <button class="ctl ctl--gas" id="btnGas" type="button" aria-label="Hold to go"><span>GO</span></button>
          <button class="ctl ctl--steer" id="btnRight" type="button" hidden aria-label="Move right">
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M14 6l16 14-16 14z" /></svg>
          </button>
        </div>
        <div class="pause-menu" id="pauseMenu" hidden>
          <div class="pause-card">
            <h2>PAUSED</h2>
            <button class="big-btn big-btn--go" id="btnResume" type="button">KEEP RACING</button>
            <button class="back-btn" id="btnQuit" type="button">◀ GARAGE</button>
          </div>
        </div>
      </section>

      <!-- Finish -->
      <section class="screen screen--finish" id="scr-finish" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <p class="finish-place" id="finishPlace">1st!</p>
        <svg class="trophy" id="trophy" viewBox="0 0 120 130" aria-hidden="true">
          <path class="cup" d="M30 12h60v22c0 20-12 36-30 38-18-2-30-18-30-38z" />
          <path class="cup" d="M30 20H14c0 16 8 26 20 28M90 20h16c0 16-8 26-20 28" fill="none" stroke-width="7" />
          <rect class="cup" x="52" y="70" width="16" height="22" />
          <rect class="base" x="32" y="92" width="56" height="12" rx="3" />
          <rect class="base" x="24" y="104" width="72" height="16" rx="4" />
          <text class="trophy-num" id="trophyNum" x="60" y="48" text-anchor="middle">1</text>
        </svg>
        <canvas id="finishCar" class="finish-car" aria-hidden="true"></canvas>
        <p class="finish-msg" id="finishMsg">Great driving!</p>
        <button class="big-btn" id="btnToPit" type="button">PIT STOP ▶</button>
      </section>

      <!-- New thing unlocked -->
      <section class="screen screen--unlock" id="scr-unlock" hidden>
        <p class="new-tag">NEW!</p>
        <div class="unlock-icon" id="unlockIcon"></div>
        <h2 class="unlock-title" id="unlockTitle"></h2>
        <p class="unlock-text" id="unlockText"></p>
        <button class="big-btn" id="btnUnlockOk" type="button">COOL!</button>
      </section>

      <!-- Pit stop -->
      <section class="screen screen--pit" id="scr-pit" hidden>
        <div class="pit-steps" id="pitSteps"></div>
        <p class="pit-say" id="pitSay">Fill up the gas!</p>
        <canvas id="pitCanvas" class="pit-canvas" aria-label="Your car in the pit"></canvas>
        <div class="pit-action">
          <div class="fuel" id="fuelBox">
            <div class="gauge" aria-hidden="true"><span>E</span><div class="gauge__bar"><i id="fuelBar"></i></div><span>F</span></div>
            <button class="big-btn" id="btnFuel" type="button">HOLD ⛽</button>
          </div>
          <button class="big-btn big-btn--go" id="btnPitDone" type="button" hidden>READY!</button>
        </div>
      </section>

      <!-- Bedtime -->
      <section class="screen screen--sleep" id="scr-sleep" hidden>
        <button class="gear gear--night" type="button" data-gear aria-label="Grown-ups: hold for settings"><i></i></button>
        <div class="moon" aria-hidden="true"></div>
        <div class="night-stars" aria-hidden="true"></div>
        <div class="house" aria-hidden="true">
          <div class="house__roof"></div>
          <div class="house__body">
            <div class="house__bay">
              <canvas id="sleepCar"></canvas>
              <div class="house__door" id="sleepDoor"></div>
            </div>
          </div>
          <span class="zzz">z<span>z</span><span>z</span></span>
        </div>
        <h2 class="sleep-title" id="sleepTitle">NIGHT NIGHT, CAR</h2>
        <p class="sleep-text" id="sleepText">Your car is resting in the garage.</p>
        <button class="big-btn" id="btnWake" type="button" hidden>PLAY AGAIN</button>
      </section>

      <!-- Turn the phone -->
      <div class="rotate" aria-hidden="true"><p>Turn your phone up and down 📱</p></div>

      <!-- Grown-ups: gate -->
      <div class="overlay" id="parentGate" hidden>
        <div class="sheet sheet--gate" role="dialog" aria-modal="true" aria-labelledby="gateQ">
          <p class="sheet-kicker">For grown-ups</p>
          <h3 id="gateQ">What is 7 × 6?</h3>
          <div class="gate-entry" id="gateEntry" aria-live="polite"></div>
          <div class="keypad" id="keypad"></div>
          <button class="link-btn" id="gateCancel" type="button">Cancel</button>
        </div>
      </div>

      <!-- Grown-ups: settings -->
      <div class="overlay" id="parentPanel" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
          <div class="sheet-head">
            <h3 id="panelTitle">Grown-up settings</h3>
            <button class="link-btn" id="panelClose" type="button">Done</button>
          </div>
          <label class="field">
            <span>Driver's name</span>
            <input id="setName" type="text" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          </label>
          <div class="field">
            <span>Races before bedtime</span>
            <div class="stepper">
              <button type="button" id="perMinus" aria-label="Fewer races">−</button>
              <output id="perVal">3</output>
              <button type="button" id="perPlus" aria-label="More races">+</button>
            </div>
          </div>
          <label class="field">
            <span>Garage rest time</span>
            <select id="setRest">
              <option value="0">No rest (play again right away)</option>
              <option value="15">15 minutes</option>
              <option value="30">30 minutes</option>
              <option value="60">1 hour</option>
              <option value="120">2 hours</option>
              <option value="tomorrow">Until tomorrow morning</option>
            </select>
          </label>
          <label class="field field--row"><span>Sounds</span><input id="setSound" type="checkbox" /></label>
          <label class="field field--row"><span>Talking voice</span><input id="setVoice" type="checkbox" /></label>
          <p class="sheet-note" id="panelStatus"></p>
          <div class="sheet-actions">
            <button type="button" class="sheet-btn" id="btnWakeNow">Wake the car now</button>
            <button type="button" class="sheet-btn" id="btnUnlockAll">Unlock everything</button>
            <button type="button" class="sheet-btn sheet-btn--warn" id="btnReset">Reset progress</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/save.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/race.js"></script>
    <script src="js/pit.js"></script>
    <script src="js/parents.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
